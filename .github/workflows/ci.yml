name: ci

on:
  push:
    branches: [main]
    tags: ["flags-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p pitflag-wire -p pitcrew-flags -p pcplugin

      - name: Build the plugins
        run: cargo build --release --target wasm32-wasip2 -p pitcrew-flags -p hello-plugin

      - name: Build pcplugin
        run: cargo build --release -p pcplugin

      - name: Validate every package
        run: |
          for dir in plugins/*/ examples/*/; do
            target/release/pcplugin validate "$dir"
          done

      - name: Run Flags for 6 seconds
        run: >
          target/release/pcplugin run plugins/flags
          --wasm target/wasm32-wasip2/release/pitcrew_flags.wasm
          --plain --ui --seconds 6
          --script "none:1,ready:1,set:1,go:1,yellow+waving:2"
          --select tabs=animations@3 --select anim-table=checkered@4

      - name: Run Hello for 3 seconds
        run: >
          target/release/pcplugin run examples/hello
          --wasm target/wasm32-wasip2/release/hello_plugin.wasm
          --ui --seconds 3 --press wave@1

      - name: Pack Flags
        run: |
          target/release/pcplugin pack plugins/flags \
            --wasm target/wasm32-wasip2/release/pitcrew_flags.wasm \
            --out dist --tag "${GITHUB_REF_NAME}"
          target/release/pcplugin check dist/pitcrew.flags-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pitcrew.flags
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/flags-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pitcrew.flags
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --title "Flags ${GITHUB_REF_NAME#flags-v}" --notes-file - <<< "See plugins/flags/CHANGELOG.md."
