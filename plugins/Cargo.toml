[workspace]
resolver = "3"
members = ["crates/pitflag-wire", "plugins/flags", "tools/pcplugin", "examples/hello"]
# `cargo build` with no -p builds the native tools; plugins are built with --target wasm32-wasip2.
default-members = ["crates/pitflag-wire", "tools/pcplugin"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/igorgsduarte/pitcrew"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
